<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Song dynasty battle backgrounds</title><style>body{margin:0;background:#1c241e;color:#eee5d6;font:16px system-ui}main{max-width:1200px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,450px),1fr));gap:20px}figure{margin:0}canvas{width:100%;display:block}button{padding:10px;margin:0 8px 16px 0}figcaption{padding:10px}a{color:#d8cc8d}</style><main><h1>Northern Song battle backgrounds</h1><p>Fifteen scenes, 1920 × 1440. Scenery stays behind the fighting area; ground continues beneath the menu.</p><button id="mode">Show fighter positions</button><a href="tile-refinements.html">Updated boats and wooden statues</a><div class="grid"></div></main><script src="../js/core/base.js"></script><script src="../js/core/gfx.js"></script><script src="../js/engine/battle.js"></script><script>
WM.battle.backgroundRoot='../assets/backgrounds/';let guides=false;const names=['forest','town','field','plains','snow','river','marsh','night','palace','interior','temple','mountain','cave','fire','ridge'],items=names.map(name=>{const f=document.createElement('figure'),cv=document.createElement('canvas'),caption=document.createElement('figcaption');cv.width=1920;cv.height=1440;caption.textContent=name;f.append(cv,caption);document.querySelector('.grid').append(f);return{name,cv,bg:WM.battle.makeBg(name)};});
function render(){for(const{cv,bg}of items){const c=cv.getContext('2d');c.setTransform(2,0,0,2,0,0);WM.battle.drawBackground(c,bg);if(guides){for(const[group,col]of[[[[600,300],[672,372],[744,444],[744,256],[816,328],[888,400],[900,230]],'#285de0'],[[[364,280],[292,352],[220,424],[226,236],[154,308],[82,380]],'#cf442c'],[[[360,380],[600,380]],'#f8dc55']])for(const[x,y]of group){c.fillStyle=col+'22';c.fillRect(x-29,y-150,58,150);c.strokeStyle=col;c.lineWidth=2;c.strokeRect(x-29,y-150,58,150);c.fillStyle='#111';c.beginPath();c.ellipse(x,y,28,5,0,0,Math.PI*2);c.fill();}c.fillStyle='#10182066';c.fillRect(0,520,960,200);}}requestAnimationFrame(render);}document.querySelector('#mode').onclick=()=>{guides=!guides;document.querySelector('#mode').textContent=guides?'Hide fighter positions':'Show fighter positions';};render();
</script></html>
