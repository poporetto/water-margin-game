<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Remaining tile collection</title><style>body{background:#19231e;color:#eee4cf;font:16px/1.5 system-ui;margin:0}main{max-width:1150px;padding:24px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}figure{padding:12px;background:#2b382f;margin:0}canvas{width:100%;image-rendering:pixelated}a{color:#d0dfa7}</style><main><h1>Remaining tile collection</h1><p>Regional shores, interior walls, winter gates and prison pieces. Native 32-pixel art, shown with a character for scale.</p><p><a href="../assets/tiles/32/part2-index.json">Numbered tile index</a> · <a href="building-tiles.html?theme=snow">Building fixes</a> · <a href="../index.html?debug">Play game</a></p><div class="grid" id="grid"></div></main><script src="../js/core/base.js"></script><script src="../js/core/sprites.js"></script><script src="../js/core/tiles.js"></script><script src="../assets/tiles.js"></script><script>
Object.keys(WM.TILE_ART.sheets).forEach(k=>WM.TILE_ART.sheets[k]='../'+WM.TILE_ART.sheets[k]);WM.state={flags:{}};WM.data=WM.data||{};const actor=WM.sprites.build('scale',{body:'#8b3328'});
const samples=['marsh','south','dusk','autumn','snow','world'].map(theme=>({name:theme+' ground and water',theme,rows:['................','..T...P.........','................','ff...:::::::....',',,...:..~~~~~~..','.....:..~wwww~..','.....:..~wwww~..','........~~~~~~..','..yyyy..........','................']}));
samples.push({name:'Interior wall, scroll and exit',interior:true,rows:['XXXXXXXXXXXXXXXX','XXXXXXXXXXXXXXXX','nnnnnnnnnnnnnnnn','nnnnnnnnnnnnnnnn','nnnnnqqqqnnnnnnn','nnnnnqqqqnnnnnnn','nnnnnnnnnnnnnnnn','nnnnnnnnnnnnnnnn','XXXXXXXDXXXXXXXX','xxxxxxxxxxxxxxxx']},{name:'Prison bars and sleeping pallet',interior:true,rows:['XXXXXXXXXXXXXXXX','XXXXXXXXXXXXXXXX','NNNNNNNNNNNNNNNN','N--NF--NF--NNNNN','N--NF--NF--NNNNN','NNNNFNNNFNNNNNNN','NFF+FFF+FFF+FNNN','NNNNNNNNNNNNNNNN','NNNNNNNNNNNNNNNN','NNNNNNNNNNNNNNNN']},{name:'Snow gate and river props',theme:'snow',rows:['................','................','################','######GG########','######GG########','......==........','..L.........L...','~~~~~~r~~~~~~~~~','~~~oo~~~~~~~~~~~','~~~~~~~~~~~~~~~~']},{name:'Autumn gate',theme:'autumn',rows:['................','................','################','######GG########','######GG########','......==........','......==........','................','................','................']},{name:'Connecting vegetable plots',theme:'south',rows:['................','................','..%%%%%..%%%%...','..%%%%%..%%%%...','..%%%%%..%%%%...','..%%%%%.........','................','................','................','................']});
function render(){document.querySelector('#grid').replaceChildren();for(const sample of samples){const rows=sample.rows,m={id:'preview',theme:sample.theme||'spring',interior:!!sample.interior,w:16,h:10,def:{world:sample.theme==='world'},get(x,y){return x<0||y<0||x>=16||y>=10?null:rows[y][x];}},cv=WM.util.makeWorldCanvas(256,160),c=cv.getContext('2d');c.drawImage(WM.tiles.bake(m),0,0,256,160);for(let y=0;y<10;y++)for(let x=0;x<16;x++)if(WM.tiles.hasTall(m.get(x,y),m))WM.tiles.drawTall(c,x*16,y*16,x,y,WM.tiles.THEMES[m.theme],m,m.get(x,y));WM.sprites.draw(c,actor,'down',0,100,140);const f=document.createElement('figure'),cap=document.createElement('figcaption');cap.textContent=sample.name;f.append(cv,cap);document.querySelector('#grid').append(f);}}
WM.tiles.onArtReady=render;WM.tiles.reloadArt();</script></html>
