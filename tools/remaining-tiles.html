<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Northern Song — object tiles</title>
<style>body{background:#18211d;color:#e8dfc5;font:16px/1.5 system-ui;margin:0}main{max-width:1200px;margin:auto;padding:24px}h1{margin:0}a{color:#c7dba1}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px}figure{margin:0;padding:12px;background:#27332c;border:1px solid #48533f;border-radius:6px}.image{height:276px;display:flex;align-items:flex-end;justify-content:center;background:repeating-conic-gradient(#344539 0% 25%,#2b392f 0% 50%) 0/16px 16px}img{image-rendering:pixelated;max-width:100%;object-fit:contain}figcaption{margin-top:10px;text-transform:capitalize}small{color:#adbba4}</style>
<main><h1>Northern Song · 32-pixel object tiles</h1><p>Closed timber doors, nature, town props, boats, furniture, and temple furnishings. Transparent backgrounds; shown at 2× actual pixels.</p><p><a href="building-tiles.html">Buildings</a> · <a href="starter-tiles.html">Terrain</a> · <a href="../index.html?debug">Play game</a></p><div class="grid" id="grid"></div></main>
<script>fetch('../assets/tiles/32/objects-index.json').then(r=>r.json()).then(data=>data.objects.forEach(o=>{const f=document.createElement('figure'),d=document.createElement('div'),i=document.createElement('img'),c=document.createElement('figcaption');d.className='image';i.src='../assets/tiles/32/'+o.file;i.width=o.width*2;i.height=o.height*2;i.alt=o.name;c.textContent=o.name.replaceAll('-',' ');const small=document.createElement('small');small.textContent=o.width+' × '+o.height+' px';d.append(i);f.append(d,c,small);document.getElementById('grid').append(f);}));</script></html>
