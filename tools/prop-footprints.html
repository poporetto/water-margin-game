<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prop scale and boundaries</title><style>body{margin:0;background:#19221e;color:#eee4cf;font:16px/1.5 system-ui}main{max-width:1150px;margin:auto;padding:24px}a{color:#c6dc9b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}figure{margin:0;background:#27362c;padding:12px}canvas{width:100%;image-rendering:pixelated}figcaption{margin-top:8px}label{display:block;margin:16px 0}</style><main><h1>Prop scale and boundaries</h1><p>Each scene includes the same character for scale. Gold outlines mark the ground cells that block movement; taller artwork may extend above them.</p><label><input id="bounds" type="checkbox" checked> Show collision boundaries</label><p><a href="remaining-tiles.html">All sprites</a> · <a href="../index.html?debug">Play game</a></p><div id="grid" class="grid"></div></main><script src="../js/core/base.js"></script><script src="../js/core/sprites.js"></script><script src="../js/core/tiles.js"></script><script src="../assets/tiles.js"></script><script>
Object.keys(WM.TILE_ART.sheets).forEach(k=>WM.TILE_ART.sheets[k]='../'+WM.TILE_ART.sheets[k]);WM.state={flags:{}};
const sheet=WM.sprites.build('scale',{body:'#8b3328',hairStyle:'topknot'});
function render(){document.getElementById('grid').replaceChildren();for(const [ch,name,interior] of [['u','Market stall',false],['t','Table',true],['c','Counter',true],['h','Shelves',true],['A','Incense altar',true],['k','Bed',true],['V','Army tent',false],['g','Grave',false],['o','Rowboat',false]]){
 const rows=Array.from({length:7},()=>Array(8).fill(ch==='o'?'~':interior?'n':'.'));rows[4][2]=ch;if(ch==='k'){rows[3][2]=rows[3][3]=rows[4][3]=ch;}
 const m={theme:'spring',interior,w:8,h:7,def:{},get(x,y){return x<0||y<0||x>=8||y>=7?null:rows[y][x];}};
 const cv=WM.util.makeWorldCanvas(128,112),c=cv.getContext('2d');c.drawImage(WM.tiles.bake(m),0,0,128,112);
 for(let y=0;y<7;y++)for(let x=0;x<8;x++){let ch=m.get(x,y);if(WM.tiles.hasTall(ch,m))WM.tiles.drawTall(c,x*16,y*16,x,y,WM.tiles.THEMES.spring,m,ch);}
 WM.sprites.draw(c,sheet,'down',0,100,80);
 const layout=WM.tiles.propLayout(m);if(document.getElementById('bounds').checked){c.strokeStyle='#ffd078';c.lineWidth=.5;for(const key in layout.occupied){const [x,y]=key.split(',').map(Number);c.strokeRect(x*16+.25,y*16+.25,15.5,15.5);}}
 const f=document.createElement('figure'),caption=document.createElement('figcaption');caption.textContent=name+' · '+Object.keys(layout.occupied).length+' blocked tiles';f.append(cv,caption);document.getElementById('grid').append(f);
 }}WM.tiles.onArtReady=render;WM.tiles.reloadArt();document.getElementById('bounds').onchange=render;
</script></html>
