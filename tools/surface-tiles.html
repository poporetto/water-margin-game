<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Surface tiles</title><style>body{margin:0;background:#19221e;color:#eee4cf;font:16px/1.5 system-ui}main{max-width:1100px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}figure{margin:0;padding:12px;background:#29392e}canvas{width:100%;image-rendering:pixelated}a{color:#c6dc9b}figcaption{margin-top:8px}</style><main><h1>Ground and interior surfaces</h1><p>32-pixel tiles, shown in repeated areas with a character for scale.</p><p><a href="prop-footprints.html">Prop sizes and boundaries</a> · <a href="../index.html?debug">Play game</a></p><div class="grid" id="grid"></div></main><script src="../js/core/base.js"></script><script src="../js/core/sprites.js"></script><script src="../js/core/tiles.js"></script><script src="../assets/tiles.js"></script><script>
Object.keys(WM.TILE_ART.sheets).forEach(k=>WM.TILE_ART.sheets[k]='../'+WM.TILE_ART.sheets[k]);WM.state={flags:{}};const actor=WM.sprites.build('scale',{body:'#8b3328'});
function render(){document.getElementById('grid').replaceChildren();const samples=[['Sand',['ssssssss','ssssssss','ssssssss','ssssssss','ssssssss','ssssssss']],['Millet fields',['yyyyyyyy','yyyyyyyy','yyyyyyyy','yyyyyyyy','yyyyyyyy','yyyyyyyy']],['Scorched earth',['!!!!!!!!','!!!!!!!!','!!!!!!!!','!!!!!!!!','!!!!!!!!','!!!!!!!!']],['Wooden floor and furniture',['XXXXXXXX','nnnnnnnn','nnhnnnnn','nnnnnnnn','nntnnnnn','nnnnnnnn']],['Stone floor and carpet',['XXXXXXXX','NNNNNNNN','NNKKKKNN','NNKKKKNN','NNKKKKNN','NNNNNNNN']],['Steps',['NNNNNNNN','NNNNNNNN','SSSSSSSS','SSSSSSSS','NNNNNNNN','NNNNNNNN']],['Bridge across river',['..~~~~..','..~~~~..','BBBBBBBB','..~~~~..','..~~~~..','..~~~~..']],['Bridge along river',['..BBBB..','~~BBBB~~','~~BBBB~~','~~BBBB~~','~~BBBB~~','..BBBB..']]];
for(const [name,rows] of samples){const m={theme:'spring',interior:name.includes('floor'),w:8,h:6,def:{},get(x,y){return x<0||y<0||x>=8||y>=6?null:rows[y][x];}};const cv=WM.util.makeWorldCanvas(128,96),c=cv.getContext('2d');c.drawImage(WM.tiles.bake(m),0,0,128,96);for(let y=0;y<6;y++)for(let x=0;x<8;x++)if(WM.tiles.hasTall(m.get(x,y),m))WM.tiles.drawTall(c,x*16,y*16,x,y,WM.tiles.THEMES.spring,m,m.get(x,y));WM.sprites.draw(c,actor,'down',0,88,80);const f=document.createElement('figure'),cap=document.createElement('figcaption');cap.textContent=name;f.append(cv,cap);document.getElementById('grid').append(f);}}
WM.tiles.onArtReady=render;WM.tiles.reloadArt();</script></html>
