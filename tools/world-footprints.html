<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seasonal tiles</title><style>body{margin:0;background:#19221e;color:#eee4cf;font:16px/1.5 system-ui}main{max-width:1100px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}figure{margin:0;padding:12px;background:#29392e}canvas{width:100%;image-rendering:pixelated}a{color:#c6dc9b}figcaption{margin-top:8px}</style><main><h1>World-map sizes and boundaries</h1><p>Gold outlines show the actual blocked area. Roads and entrances stay clear.</p><p><a href="prop-footprints.html">Prop sizes and boundaries</a> · <a href="../index.html?debug">Play game</a></p><div class="grid" id="grid"></div><h2>World-map destinations</h2><img alt="Song dynasty map symbols" src="../assets/tiles/32/world-icons.png" style="max-width:100%;image-rendering:pixelated;background:#d8c99f"></main><script src="../js/core/base.js"></script><script src="../js/core/sprites.js"></script><script src="../js/core/tiles.js"></script><script src="../assets/tiles.js"></script><script>
Object.keys(WM.TILE_ART.sheets).forEach(k=>WM.TILE_ART.sheets[k]='../'+WM.TILE_ART.sheets[k]);WM.state={flags:{}};WM.data=WM.data||{};const actor=WM.sprites.build('scale',{body:'#8b3328'});
function render(){document.getElementById('grid').replaceChildren();const samples=[['Mountain range',['................','................','..MMMMMM........','..MMMMMM........','................','................','................','................']],['Isolated woodland',['................','................','..T.....b.......','................','................','................','................','................']],['Road through forest',['................','................','..TT:TT.........','..TT:TT.........','....:...........','....:...........','................','................']],['Narrow passage',['MMMMMMMMMMMMMMMM','MM.T..........MM','MMMM.MMMMMMMMMMM','MM............MM','MM............MM','MMMMMMMMMMMMMMMM','................','................']]];
for(const [name,rows] of samples){const m={theme:'world',interior:name.includes('floor'),w:16,h:8,def:{world:true},get(x,y){return x<0||y<0||x>=16||y>=8?null:rows[y][x];}};const cv=WM.util.makeWorldCanvas(256,128),c=cv.getContext('2d');c.drawImage(WM.tiles.bake(m),0,0,256,128);for(let y=0;y<8;y++)for(let x=0;x<16;x++)if(WM.tiles.hasTall(m.get(x,y),m))WM.tiles.drawTall(c,x*16,y*16,x,y,WM.tiles.THEMES.world,m,m.get(x,y));c.strokeStyle='#f1bf50';c.lineWidth=.5;WM.tiles.worldTerrainLayout(m).items.forEach(p=>c.strokeRect(p.x*16+.25,p.y*16+.25,p.w*16-.5,p.h*16-.5));WM.sprites.draw(c,actor,'down',0,88,96);const f=document.createElement('figure'),cap=document.createElement('figcaption');cap.textContent=name;f.append(cv,cap);document.getElementById('grid').append(f);}}
WM.tiles.onArtReady=render;WM.tiles.reloadArt();</script></html>
