<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Room</title>
<!-- Every track in the game, with its title, mood and where it fits: play one to hear it as the game does. -->
<style>
  :root { --bg: #14100c; --panel: #1e1813; --line: #3a2f24; --text: #ece3d3; --dim: #a39684; --gold: #d8b36a; --on: #2c4a2a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 Georgia, 'Times New Roman', serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-weight: normal; color: var(--gold); margin: 0 0 4px; }
  p.lead { color: var(--dim); margin: 0 0 20px; }
  h2 { font-weight: normal; color: var(--gold); border-bottom: 1px solid var(--line); padding-bottom: 6px; margin: 28px 0 10px; }
  .track { display: grid; grid-template-columns: 44px 1fr; gap: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); margin-bottom: 8px; }
  .track.playing { border-color: var(--gold); background: var(--on); }
  button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--gold); background: transparent; color: var(--gold); font-size: 18px; cursor: pointer; }
  .title { font-size: 18px; }
  .meta { color: var(--dim); font-size: 13px; font-family: ui-monospace, Menlo, monospace; margin-top: 2px; }
  .desc { color: var(--text); opacity: .9; margin-top: 4px; }
  .vol { color: var(--dim); font-size: 14px; display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
</style>
</head>
<body>
<main>
  <h1>Music Room</h1>
  <p class="lead">Every piece in the game, played by the game's own synthesizer. The id (in grey) is what a map or scene names in <code>music:</code> or <code>s.music(...)</code>.</p>
  <div class="vol">Volume <input id="vol" type="range" min="0" max="1" step="0.05" value="0.55"></div>
  <h2>Story, battle and ceremony</h2>
  <div id="story"></div>
  <h2>Places</h2>
  <div id="places"></div>
</main>
<script src="../js/core/base.js"></script>
<script src="../js/core/audio.js"></script>
<script src="../js/data/music.js"></script>
<script src="../js/data/music-places.js"></script>
<script>
  var A = WM.audio, PLACES = ['capital', 'county', 'riverport', 'frontier', 'lakecity', 'village', 'fishing', 'marsh', 'forest', 'temple', 'daoist', 'haunted', 'bandits', 'manor', 'shadyinn', 'fortress'];
  var rows = {};
  function row(id) {
    var t = A.tracks[id], el = document.createElement('div');
    el.className = 'track';
    var instr = t.ch.map(function (c) { return c.inst; }).filter(function (v, i, a) { return a.indexOf(v) === i; }).join(', ');
    el.innerHTML = '<button aria-label="Play">&#9654;</button><div><div class="title"></div><div class="meta"></div><div class="desc"></div></div>';
    el.querySelector('.title').textContent = t.title || id;
    el.querySelector('.meta').textContent = id + ' · ' + t.bpm + ' bpm · ' + t.key + ' · ' + instr;
    el.querySelector('.desc').textContent = t.desc || '';
    el.querySelector('button').onclick = function () { toggle(id); };
    rows[id] = el;
    return el;
  }
  function toggle(id) {
    A.unlock();
    if (A.current === id) A.stop(); else A.play(id);
    Object.keys(rows).forEach(function (k) {
      var on = A.current === k;
      rows[k].classList.toggle('playing', on);
      rows[k].querySelector('button').innerHTML = on ? '&#9632;' : '&#9654;';
      rows[k].querySelector('button').setAttribute('aria-label', on ? 'Stop' : 'Play');
    });
  }
  Object.keys(A.tracks).forEach(function (id) { document.getElementById(PLACES.indexOf(id) >= 0 ? 'places' : 'story').appendChild(row(id)); });
  document.getElementById('vol').oninput = function (e) { A.unlock(); A.setVolumes(+e.target.value, A.sfxVol); };
</script>
</body>
</html>
