<main><h1>Song Jiang · Classic movement</h1><p><a href="in-game.html">Open on game location backgrounds</a> · <a href="README.md">Files and generation prompts</a></p><p>Four-direction walking, original Classic proportions, and one static dynamic battle pose.</p><button id="pause">Pause walk</button><section class="grid">

<h2>Battle · one static left-facing pose</h2><a href="songjiang-battle.png"><img class="battle" src="songjiang-battle.png" width="576" height="384" alt="Song Jiang's single dynamic sword pose facing left"></a>
<details><summary>Walking sheet</summary><img src="walking-preview.png" width="576" height="1024" alt="Song Jiang four-direction walking sheet"></details></main>
<script>(async()=>{const img=new Image();img.src='songjiang-walking.png';await img.decode();let paused=false,time=0,last=0;document.getElementById('pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Play walk':'Pause walk'};function draw(now){if(last&&!paused)time+=Math.min(now-last,100);last=now;const col=[0,1,0,2][Math.floor(time/200)%4];document.querySelectorAll('canvas').forEach(cv=>{const c=cv.getContext('2d');c.imageSmoothingEnabled=false;c.clearRect(0,0,192,256);c.drawImage(img,col*96,Number(cv.dataset.row)*128,96,128,0,0,192,256)});requestAnimationFrame(draw)}requestAnimationFrame(draw);window.spritePreviewReady=true;})()</script></html>
